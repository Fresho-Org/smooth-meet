<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Meet Queue</title>
    <script src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body { font-family: 'Google Sans', Roboto, Arial, sans-serif; padding: 15px; margin: 0; background: #fff; color: #3c4043; }
        h2 { font-size: 14px; font-weight: 500; margin: 15px 0 10px 0; color: #5f6368; text-transform: uppercase; letter-spacing: 0.5px; }
        .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        button { border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: 500; font-size: 13px; transition: all 0.2s; text-align: left; }
        button:disabled { background-color: #f1f3f4 !important; color: #3c404361 !important; border: none !important; cursor: not-allowed; }

        #btn-PROCESS { background-color: #f3e5f5; color: #7b1fa2; border: 1px solid #e1bee7; }
        #btn-CLARIFY { background-color: #fef7e0; color: #b06000; border: 1px solid #fbdf9a; }
        #btn-DIRECT { background-color: #e6fffa; color: #00897b; border: 1px solid #b2dfdb; }
        #btn-SPEAK { background-color: #1a73e8; color: white; }
        #btn-robot { background-color: #fff; color: #5f6368; border: 1px solid #dadce0; font-size: 11px; margin-top: 5px; text-align: center; }

        #queue-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid #f1f3f4; }
        .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f3f4; font-size: 13px; }
        .badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-right: 8px; text-transform: uppercase; font-weight: bold; border: 1px solid rgba(0, 0, 0, 0.1); }
        .badge-PROCESS { background: #f3e5f5; color: #7b1fa2; }
        .badge-CLARIFY { background: #fef7e0; color: #b06000; }
        .badge-DIRECT { background: #e6fffa; color: #00897b; }

        .user-cell { display: flex; align-items: center; gap: 8px; }
        .avatar { width: 20px; height: 20px; border-radius: 50%; background: #eee; }
        
        .my-item { color: #1a73e8; font-weight: 500; background: #f8faff; margin: 0 -15px; padding-left: 15px; padding-right: 15px; }
        .done-btn { background: none; color: #9aa0a6; border: 1px solid #dadce0; padding: 3px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; }
        .done-btn:hover { background: #f1f3f4; color: #3c4043; }

        #identity-banner { font-size: 10px; color: #70757a; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #f1f3f4; padding-bottom: 10px; }
    </style>
</head>

<body>
    <div id="identity-banner">Connecting...</div>

    <div class="controls">
        <button id="btn-PROCESS" disabled></button>
        <button id="btn-CLARIFY" disabled></button>
        <button id="btn-DIRECT" disabled></button>
        <button id="btn-SPEAK" disabled></button>
        <button id="btn-robot" disabled>🤖 Add Random Robot (Test)</button>
    </div>

    <h2>Speaking Queue</h2>
    <ul id="queue-list">
        <li style="color: #70757a; font-size: 12px; padding-top: 10px;">Queue is empty</li>
    </ul>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const GOOGLE_CLIENT_ID = "139985780449-fbb9qvek9pe0tno7382k10t6lukrg2ji.apps.googleusercontent.com";

        const SIGNALS = {
            PROCESS: { id: 'PROCESS', priority: 0, label: 'Process Point', icon: '⚙️', tip: 'Request alternative process: reconvening, breakout groups, etc.' },
            CLARIFY: { id: 'CLARIFY', priority: 1, label: 'Clarify', icon: '❓', tip: 'Quick question to clarify what was said.' },
            DIRECT: { id: 'DIRECT', priority: 2, label: 'Direct Response', icon: '💡', tip: 'Provide new info that directly relates to current point.' },
            SPEAK: { id: 'SPEAK', priority: 3, label: 'Speak', icon: '🙋', tip: 'I have something to say.' }
        };

        const firebaseConfig = {
            databaseURL: "https://smooth-meet-default-rtdb.asia-southeast1.firebasedatabase.app/",
            apiKey: "AIzaSyAtTCUtPIhW0sWFFf-REKKp3t-fOTS4ons",
            authDomain: "smooth-meet.firebaseapp.com",
            projectId: "smooth-meet",
            storageBucket: "smooth-meet.firebasestorage.app",
            messagingSenderId: "139985780449",
            appId: "1:139985780449:web:86cca73a8da365dd7081a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let queueRef, roomCode;

        // Identity State
        let myId = localStorage.getItem("smoothMeetName") || "Anonymous";
        let myPhoto = localStorage.getItem("smoothMeetPhoto") || "";

        // Helper: Simple JWT Decoder
        function decodeJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        }

        // --- SSO HANDLER ---
        window.handleCredentialResponse = (response) => {
            const user = decodeJwt(response.credential);
            myId = user.name;
            myPhoto = user.picture;
            
            // Persist locally
            localStorage.setItem("smoothMeetName", myId);
            localStorage.setItem("smoothMeetPhoto", myPhoto);

            updateBanner();
        };

        function updateBanner() {
            const banner = document.getElementById('identity-banner');
            const photoHtml = myPhoto ? `<img src="${myPhoto}" class="avatar" />` : '';
            banner.innerHTML = `<div class="user-cell" style="justify-content:center;">${photoHtml} <b>${myId}</b> | Room: ${roomCode || '...'}</div>`;
        }

        // Initialize Buttons
        Object.values(SIGNALS).forEach(sig => {
            const btn = document.getElementById(`btn-${sig.id}`);
            if (btn) {
                btn.innerText = `${sig.icon} ${sig.label}`;
                btn.title = sig.tip;
            }
        });

        async function initAddon() {
            try {
                // Initialize SSO (One Tap Prompt)
                if (window.google) {
                    google.accounts.id.initialize({
                        client_id: GOOGLE_CLIENT_ID,
                        callback: handleCredentialResponse,
                        auto_select: true // Try to sign in silently
                    });
                    google.accounts.id.prompt(); // Show the 'Continue as...' prompt
                }

                const session = await meet.addon.createAddonSession({ cloudProjectNumber: '139985780449' });
                const sidePanelClient = await session.createSidePanelClient();
                const meetingInfo = await sidePanelClient.getMeetingInfo();
                roomCode = meetingInfo.meetingCode;
                queueRef = ref(db, `meetings/${roomCode}/queue`);

                updateBanner();
                document.querySelectorAll('button').forEach(b => b.disabled = false);

                onValue(queueRef, (snapshot) => {
                    const queueListEl = document.getElementById('queue-list');
                    queueListEl.innerHTML = "";

                    if (!snapshot.exists()) {
                        queueListEl.innerHTML = '<li style="color: #70757a; font-size: 12px; padding-top: 10px;">Queue is empty</li>';
                        toggleButtons(false);
                        return;
                    }

                    const queueArray = Object.entries(snapshot.val()).map(([key, val]) => ({ key, ...val }));
                    toggleButtons(queueArray.some(item => item.name === myId));

                    const getPrio = (type) => SIGNALS[type]?.priority ?? 99;
                    queueArray.sort((a, b) => (getPrio(a.type) - getPrio(b.type)) || (a.timestamp - b.timestamp));

                    queueArray.forEach((item, index) => {
                        const isMe = item.name === myId;
                        const sig = SIGNALS[item.type];
                        const li = document.createElement('li');
                        li.className = `queue-item ${isMe ? 'my-item' : ''}`;

                        li.innerHTML = `
                            <div class="user-cell">
                                <span>${index + 1}.</span>
                                ${sig.priority < 3 ? `<span class="badge badge-${item.type}">${sig.label}</span>` : ''}
                                ${item.photo ? `<img src="${item.photo}" class="avatar" />` : ''}
                                <span>${item.name}</span>
                            </div>
                            <button class="done-btn" onclick="deleteItem('${item.key}')">Done</button>
                        `;
                        queueListEl.appendChild(li);
                    });
                });
            } catch (e) { console.error(e); }
        }

        window.deleteItem = (key) => remove(ref(db, `meetings/${roomCode}/queue/${key}`));

        function toggleButtons(disabled) {
            Object.keys(SIGNALS).forEach(id => {
                const btn = document.getElementById(`btn-${id}`);
                if (btn) btn.disabled = disabled;
            });
        }

        Object.keys(SIGNALS).forEach(id => {
            document.getElementById(`btn-${id}`).onclick = () => {
                push(queueRef, { 
                    name: myId, 
                    photo: myPhoto, 
                    timestamp: Date.now(), 
                    type: id 
                });
            };
        });

        document.getElementById('btn-robot').onclick = () => {
            if (!queueRef) return;
            const keys = Object.keys(SIGNALS);
            const randomType = keys[Math.floor(Math.random() * keys.length)];
            const rId = Math.floor(Math.random() * 1000);
            push(queueRef, { name: "🤖 Bot-" + rId, photo: "", timestamp: Date.now(), type: randomType });
        };

        initAddon();
    </script>
</body>

</html>
