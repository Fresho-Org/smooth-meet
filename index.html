<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Meet Queue & Chat</title>
    <script src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background: #fff;
            color: #3c4043;
            overflow: hidden;
        }

        #identity-banner {
            font-size: 10px;
            color: #70757a;
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #f1f3f4;
            flex-shrink: 0;
        }

        /* Top Section: Queue (50%) */
        #queue-section {
            height: 50vh;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            border: none;
            padding: 16px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            font-size: 16px;
            transition: 0.2s;
            text-align: left;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #f1f3f4;
            color: #3c404361;
            cursor: not-allowed;
            box-shadow: none;
        }

        #btn-PROCESS {
            background: #f3e5f5;
            color: #7b1fa2;
            border: 1px solid #e1bee7;
        }

        #btn-CLARIFY {
            background: #fef7e0;
            color: #b06000;
            border: 1px solid #fbdf9a;
        }

        #btn-DIRECT {
            background: #e6fffa;
            color: #00897b;
            border: 1px solid #b2dfdb;
        }

        #btn-SPEAK {
            background: #1a73e8;
            color: white;
        }

        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f3f4;
            font-size: 13px;
        }

        .badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge-PROCESS {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-CLARIFY {
            background: #fef7e0;
            color: #b06000;
        }

        .badge-DIRECT {
            background: #e6fffa;
            color: #00897b;
        }

        .my-item {
            color: #1a73e8;
            font-weight: 500;
            background: #f8faff;
            margin: 0 -15px;
            padding: 10px 15px;
        }

        .done-btn {
            background: none;
            color: #9aa0a6;
            border: 1px solid #dadce0;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
        }

        /* Bottom Section: Chat (50%) */
        #chat-section {
            height: 50vh;
            border-top: 2px solid #dadce0;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        #chat-header {
            padding: 8px 15px;
            font-size: 11px;
            font-weight: bold;
            color: #5f6368;
            letter-spacing: 0.8px;
            background: #f1f3f4;
            text-transform: uppercase;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg {
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg b {
            color: #1a73e8;
            font-weight: 500;
            margin-right: 4px;
        }

        #chat-input-area {
            padding: 12px;
            background: #fff;
            border-top: 1px solid #dadce0;
            flex-shrink: 0;
        }

        #chat-input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #dadce0;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 13px;
            outline: none;
        }

        #chat-input:focus {
            border-color: #1a73e8;
        }
    </style>
</head>

<body>
    <div id="identity-banner">Connecting to Google...</div>

    <div id="queue-section">
        <div class="controls">
            <button id="btn-PROCESS" disabled></button>
            <button id="btn-CLARIFY" disabled></button>
            <button id="btn-DIRECT" disabled></button>
            <button id="btn-SPEAK" disabled></button>
        </div>
        <h2 style="font-size:11px; color:#5f6368; margin: 5px 0 10px 0; text-transform: uppercase;">Speaking Queue</h2>
        <ul id="queue-list" style="list-style:none; padding:0; margin:0;"></ul>
    </div>

    <div id="chat-section">
        <div id="chat-header">Chat History</div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, limitToLast, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const GOOGLE_CLIENT_ID = "923559797891-3hb1p0ferqpss4japg6or695n45ttcvk.apps.googleusercontent.com";
        const SIGNALS = {
            PROCESS: { id: 'PROCESS', priority: 0, label: 'Process Point', icon: '⚙️', tip: 'Request alternative process: reconvening, breakout groups, etc.' },
            CLARIFY: { id: 'CLARIFY', priority: 1, label: 'Clarify', icon: '❓', tip: 'Quick question to clarify what was said.' },
            DIRECT: { id: 'DIRECT', priority: 2, label: 'Direct Response', icon: '💡', tip: 'Provide new info that directly relates to current point.' },
            SPEAK: { id: 'SPEAK', priority: 3, label: 'Speak', icon: '🙋', tip: 'I have something to say.' }
        };

        const firebaseConfig = {
            databaseURL: "https://smooth-meet-default-rtdb.asia-southeast1.firebasedatabase.app/",
            apiKey: "AIzaSyAtTCUtPIhW0sWFFf-REKKp3t-fOTS4ons",
            authDomain: "smooth-meet.firebaseapp.com",
            projectId: "smooth-meet",
            storageBucket: "smooth-meet.firebasestorage.app",
            messagingSenderId: "139985780449",
            appId: "1:139985780449:web:86cca73a8da365dd7081a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let queueRef, chatRef, roomCode;

        let myId = localStorage.getItem("smoothMeetName") || "Anonymous";
        let myPhoto = localStorage.getItem("smoothMeetPhoto") || "";

        function decodeJwt(token) { return JSON.parse(window.atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); }

        window.handleCredentialResponse = (r) => {
            const user = decodeJwt(r.credential);
            myId = user.name; myPhoto = user.picture;
            localStorage.setItem("smoothMeetName", myId);
            localStorage.setItem("smoothMeetPhoto", myPhoto);
            updateBanner();
        };

        function updateBanner() {
            const banner = document.getElementById('identity-banner');
            banner.innerHTML = `<b>${myId}</b> | Room: ${roomCode || '...'}`;
        }

        Object.values(SIGNALS).forEach(sig => {
            const btn = document.getElementById(`btn-${sig.id}`);
            if (btn) { btn.innerText = `${sig.icon} ${sig.label}`; btn.title = sig.tip; }
        });

        async function initAddon() {
            try {
                if (window.google) {
                    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse, auto_select: true });
                    google.accounts.id.prompt();
                }

                const session = await meet.addon.createAddonSession({ cloudProjectNumber: '923559797891' });
                const sidePanelClient = await session.createSidePanelClient();
                const meetingInfo = await sidePanelClient.getMeetingInfo();
                roomCode = meetingInfo.meetingCode;

                queueRef = ref(db, `meetings/${roomCode}/queue`);
                chatRef = ref(db, `meetings/${roomCode}/chat`);

                updateBanner();
                document.querySelectorAll('button').forEach(b => b.disabled = false);

                // Only clear if the data currently in the room is "Old" 
                // (e.g., the meeting happened more than 4 hours ago)
                onValue(ref(db, `meetings/${roomCode}`), (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        // Check the timestamp of the first queue item or chat msg
                        const firstTimestamp = data.queue ? Object.values(data.queue)[0].timestamp : data.chat ? Object.values(data.chat)[0].timestamp : 0;

                        const fourHoursAgo = Date.now() - (12 * 60 * 60 * 1000);

                        if (firstTimestamp > 0 && firstTimestamp < fourHoursAgo) {
                            console.log("Cleaning up old meeting data...");
                            remove(ref(db, `meetings/${roomCode}`));
                        }
                    }
                }, { onlyOnce: true });

                onValue(queueRef, (snapshot) => {
                    const el = document.getElementById('queue-list');
                    el.innerHTML = "";
                    if (!snapshot.exists()) return;
                    const queueArray = Object.entries(snapshot.val()).map(([key, val]) => ({ key, ...val }));
                    const getPrio = (t) => SIGNALS[t]?.priority ?? 99;
                    queueArray.sort((a, b) => (getPrio(a.type) - getPrio(b.type)) || (a.timestamp - b.timestamp));
                    queueArray.forEach((item, index) => {
                        const li = document.createElement('li');
                        li.className = `queue-item ${item.name === myId ? 'my-item' : ''}`;
                        li.innerHTML = `
                            <span>${index + 1}. ${SIGNALS[item.type].priority < 3 ? `<span class="badge badge-${item.type}">${item.type}</span>` : ''} ${item.name}</span>
                            <button class="done-btn" onclick="deleteItem('${item.key}')">Done</button>
                        `;
                        el.appendChild(li);
                    });
                });

                // --- CHAT LOGIC ---
                onValue(query(chatRef, limitToLast(20)), (snapshot) => {
                    const el = document.getElementById('chat-messages');
                    el.innerHTML = "";
                    snapshot.forEach(child => {
                        const m = child.val();
                        const div = document.createElement('div');
                        div.className = "msg";
                        div.innerHTML = `<b>${m.user}:</b> ${m.text}`;
                        el.appendChild(div);
                    });
                    el.scrollTop = el.scrollHeight; // Auto-scroll to bottom
                });

            } catch (e) { console.error(e); }
        }

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== "") {
                push(chatRef, { user: myId, text: e.target.value, timestamp: Date.now() });
                e.target.value = "";
            }
        });

        window.deleteItem = (key) => remove(ref(db, `meetings/${roomCode}/queue/${key}`));

        Object.keys(SIGNALS).forEach(id => {
            document.getElementById(`btn-${id}`).onclick = () => push(queueRef, { name: myId, photo: myPhoto, timestamp: Date.now(), type: id });
        });

        initAddon();
    </script>
</body>

</html>
