<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Meet Queue</title>
    <script src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"></script>
    
    <style>
        body { font-family: 'Google Sans', Roboto, Arial, sans-serif; padding: 20px; margin: 0; background: #fff; color: #3c4043; }
        h2 { font-size: 16px; font-weight: 500; margin: 0 0 15px 0; }
        
        /* Main Interaction Buttons */
        .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
        
        #btn-raise { 
            background-color: #1a73e8; color: white; border: none; padding: 12px; 
            border-radius: 24px; cursor: pointer; font-weight: 500; font-size: 14px; 
            transition: background 0.2s;
        }
        #btn-raise:hover { background-color: #1765cc; }
        #btn-raise:disabled { background-color: #f1f3f4; color: #3c404361; cursor: not-allowed; }

        #btn-robot { 
            background-color: #fff; color: #5f6368; border: 1px solid #dadce0; padding: 8px; 
            border-radius: 24px; cursor: pointer; font-size: 12px; transition: background 0.2s;
        }
        #btn-robot:hover { background-color: #f8f9fa; }

        /* Queue List Styling */
        #queue-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid #f1f3f4; }
        .queue-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 0; border-bottom: 1px solid #f1f3f4; font-size: 14px;
        }
        .my-item { color: #1a73e8; font-weight: 500; }

        .done-btn { 
            background: none; color: #5f6368; border: 1px solid #dadce0; padding: 4px 12px; 
            border-radius: 4px; font-size: 11px; cursor: pointer;
        }
        .done-btn:hover { background: #f1f3f4; color: #202124; }
        
        #identity-banner { font-size: 11px; color: #70757a; margin-bottom: 20px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>
    
    <div id="identity-banner">Connecting to Google Meet...</div>
    
    <div class="controls">
        <button id="btn-raise" disabled>🙋 Raise Hand</button>
        <button id="btn-robot" disabled>🤖 Add Robot (Test)</button>
    </div>

    <h2>Speaking Queue</h2>
    <ul id="queue-list">
        <li style="color: #70757a; font-size: 13px; padding-top: 10px;">Queue is empty</li>
    </ul>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://smooth-meet-default-rtdb.asia-southeast1.firebasedatabase.app/",
            apiKey: "AIzaSyAtTCUtPIhW0sWFFf-REKKp3t-fOTS4ons",
            authDomain: "smooth-meet.firebaseapp.com",
            projectId: "smooth-meet",
            storageBucket: "smooth-meet.firebasestorage.app",
            messagingSenderId: "139985780449",
            appId: "1:139985780449:web:86cca73a8da365dd7081a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let queueRef; 

        // Generate Identity
        let myId = localStorage.getItem("smoothMeetUUID");
        if (!myId) {
            myId = "User-" + crypto.randomUUID().split('-')[0];
            localStorage.setItem("smoothMeetUUID", myId);
        }

        async function initAddon() {
            try {
                const session = await meet.addon.createAddonSession({
                    cloudProjectNumber: '139985780449' 
                });
                
                const sidePanelClient = await session.createSidePanelClient();
                const meetingInfo = await sidePanelClient.getMeetingInfo();
                const roomCode = meetingInfo.meetingCode;

                queueRef = ref(db, `meetings/${roomCode}/queue`);

                document.getElementById('identity-banner').innerHTML = `
                    <b>ID:</b> ${myId} &nbsp; | &nbsp; <b>Room:</b> ${roomCode}
                `;

                document.getElementById('btn-raise').disabled = false;
                document.getElementById('btn-robot').disabled = false;

                onValue(queueRef, (snapshot) => {
                    const queueListEl = document.getElementById('queue-list');
                    queueListEl.innerHTML = ""; 

                    if (!snapshot.exists()) {
                        queueListEl.innerHTML = '<li style="color: #70757a; font-size: 13px; padding-top: 10px;">Queue is empty</li>';
                        document.getElementById('btn-raise').disabled = false; 
                        return;
                    }

                    let queueArray = [];
                    let amIInQueue = false;

                    snapshot.forEach(child => {
                        const item = child.val();
                        queueArray.push({ key: child.key, ...item });
                        if (item.name === myId) amIInQueue = true; 
                    });

                    document.getElementById('btn-raise').disabled = amIInQueue;
                    queueArray.sort((a, b) => a.timestamp - b.timestamp);

                    queueArray.forEach((item, index) => {
                        const li = document.createElement('li');
                        li.className = 'queue-item';
                        if (item.name === myId) li.classList.add('my-item');
                        
                        li.innerHTML = `
                            <span>${index + 1}. ${item.name}</span>
                            <button class="done-btn" data-key="${item.key}">Done</button>
                        `;
                        queueListEl.appendChild(li);
                    });

                    // Event delegation for "Done" buttons
                    document.querySelectorAll('.done-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const itemKey = e.target.getAttribute('data-key');
                            remove(ref(db, `meetings/${roomCode}/queue/${itemKey}`));
                        });
                    });
                });

            } catch (error) {
                console.error("Add-on init failed:", error);
            }
        }

        // Logic for Real User
        document.getElementById('btn-raise').addEventListener('click', () => {
            if (!queueRef) return;
            push(queueRef, { name: myId, timestamp: Date.now() });
        });

        // Logic for Robot Tester
        document.getElementById('btn-robot').addEventListener('click', () => {
            if (!queueRef) return;
            const robotNum = Math.floor(Math.random() * 1000);
            push(queueRef, { name: "🤖 Robot-" + robotNum, timestamp: Date.now() });
        });

        initAddon();
    </script>
</body>
</html>
